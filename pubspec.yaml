  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  flutter_svg: ^2.0.9
  dio: ^5.4.0
  injectable: ^2.3.2
  auto_route: ^8.0.0
  flutter_bloc: ^9.1.1
  dartx: ^1.2.0
  freezed_annotation: ^2.4.1
  intl: ^0.19.0
  json_annotation: ^4.8.1
  pin_code_fields: ^8.0.1
  dartz: ^0.10.1
  provider: ^6.1.1
  get_it: ^8.3.0
  flutter_easyloading: ^3.0.5
  loading_animation_widget: ^1.2.0+4
  top_snackbar_flutter: ^3.1.0
  dropdown_button2: ^2.3.9
  flutter_datetime_picker_plus: ^2.1.0
  file_picker: ^10.3.10 # Updated for Android 14+
  geocoding: ^4.0.0
  location: ^8.0.1
  geolocator: ^14.0.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.0
  carousel_slider: ^5.0.0
  dots_indicator: ^4.0.1
  flutter_slidable: ^4.0.0
  flutter_rating_bar: ^4.0.1
  html: ^0.15.4
  video_player: ^2.9.0
  chewie: ^1.8.5
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  # firebase_analytics: ^10.4.1
  firebase_database: ^12.1.2
  overlay_support: ^2.1.0
  infinite_scroll_pagination: ^5.1.1
  cached_network_image: ^3.3.1
  flutter_local_notifications: ^19.5.0
  google_maps_flutter: ^2.5.0
  upgrader: ^12.5.0
  qr_flutter: ^4.1.0
  image_gradient: ^0.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  permission_handler: ^12.0.1
  qr_code_scanner_plus: ^2.0.6
  dotted_border: ^2.1.0
  camera: ^0.11.2+1
  image_picker: ^1.1.0
  image_cropper: ^11.0.0
  image: ^4.0.14
  # image_gallery_saver: ^2.0.3
  device_info_plus: ^10.1.0
  qr_code_dart_scan: ^0.11.5
  flutter_html: ^3.0.0-beta.2
  logger: ^2.5.0
  syncfusion_flutter_datepicker: ^31.1.19
  photo_view: ^0.15.0






  flutter_localizations:
    sdk: flutter
  curl_logger_dio_interceptor: ^1.0.0
  fluttertoast: ^9.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.3.0
  highlight_text: ^1.8.0
  toastification: ^3.0.3
  android_id: ^0.5.1


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  freezed: ^2.4.6
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1
  auto_route_generator: ^8.0.0
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.8.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/TASA_iconapp.png"
  min_sdk_android: 21 # android min sdk_version

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    flutter_svg: true

  assets:
    enabled: true
    outputs:
      class_name: Assets
      package_parameter_enabled: false
      style: dot-delimiter

    
flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/jsons/
    - assets/lang/
    - assets/svg/

  fonts:
    - family: Helvetica Neu
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Light.ttf
          weight: 400
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Thin.ttf
          weight: 300
    - family: FontAwesome
      fonts:
        - asset: assets/fonts/icon_fonts/fa-thin-100.ttf
          weight: 100
        - asset: assets/fonts/icon_fonts/fa-light-300.ttf
          weight: 300
        - asset: assets/fonts/icon_fonts/fa-regular-400.ttf
          weight: 400
        - asset: assets/fonts/icon_fonts/fa-solid-900.ttf
          weight: 900